services:
  # ponytail: only starts with `--profile local-db`; otherwise point MONGO_URI at your own mongo
  mongo:
    image: mongo:7
    profiles: ["local-db"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
          pids: 200
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/iprodigital}
      PORT: "4000"
    volumes:
      - uploads:/app/uploads
    expose:
      - "4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
          pids: 100
    ports:
      - "127.0.0.1:8093:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads:
