services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/iprodigital
      PORT: "4000"
    volumes:
      - uploads:/app/uploads
    expose:
      - "4000"
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8093:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads:
